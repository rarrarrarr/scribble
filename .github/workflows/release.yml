# Builds the package and, when a GitHub release is published, uploads it to PyPI.
#
# Publishing uses PyPI trusted publishing: PyPI trusts this workflow file in this repo,
# so no API token is stored anywhere. See "Releasing" in README.md for the one-time setup.
#
# Run it by hand (Actions tab > release > Run workflow) to check that the package
# builds, installs and passes the tests, without publishing anything.
#
# Building and testing are separate jobs, so on separate machines. The tests install
# and run every dependency in uv.lock; if one of them were ever compromised, it could
# change the files on its machine, but not the package that gets published. The build
# job runs nothing but uv's build backend, and records a checksum of each file it
# builds; the publish job uploads only files that match.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sums.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false  # don't leave the GitHub token in .git/config for later steps

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # the cache is shared with CI runs on main, which run every dependency
          enable-cache: false

      - name: Check the release tag matches the version in pyproject.toml
        if: github.event_name == 'release'
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Release tag is ${GITHUB_REF_NAME} but pyproject.toml says ${version}; the tag should be v${version}."
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Record checksums of the built files
        id: sums
        run: |
          {
            echo "sha256<<EOF"
            (cd dist && sha256sum -- *)
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum -- *)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false  # don't leave the GitHub token in .git/config for later steps

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      # GitHub's runners have no GPU, so the GPU tests skip here: run `uv run pytest`
      # on a machine with one before releasing (see README, Releasing).
      - name: Run the tests
        run: uv run --locked pytest

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/

      - name: Install the built wheel and run it
        run: uv run --isolated --no-project --with dist/*.whl scribble --help

  publish:
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scribble-video/
    permissions:
      id-token: write  # lets PyPI verify this workflow (trusted publishing)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/

      # The same files, and only those, as the build job made.
      - name: Check the files are the ones the build job made
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          actual="$(cd dist && sha256sum -- *)"
          if [ "${actual}" != "${EXPECTED}" ]; then
            echo "::error::dist/ doesn't match what the build job made."
            echo "expected:"; echo "${EXPECTED}"
            echo "found:"; echo "${actual}"
            exit 1
          fi

      # PyPA's official publisher. With trusted publishing it also signs each file and
      # uploads a provenance attestation, shown on PyPI as which repo, workflow and
      # commit built it.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
