[project]
name = "scribble-video"
version = "0.1.1"
description = "Turn a video (or a YouTube link) into a pencil-and-ink sketch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg",
    "numpy",
    "opencv-python-headless",
    "yt-dlp",
]

[project.scripts]
scribble = "scribble.cli:main"

[project.urls]
Repository = "https://github.com/rarrarrarr/scribble"
Issues = "https://github.com/rarrarrarr/scribble/issues"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

# The package is src/scribble; without this, uv_build would look for src/scribble_video.
[tool.uv.build-backend]
module-name = "scribble"
