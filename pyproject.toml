[project]
name = "scribble-video"
version = "0.3.3"
description = "Turn a video (or a YouTube link) into a pencil-and-ink sketch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg",
    "numpy",
    "opencv-python-headless",
    "yt-dlp",
]

[project.scripts]
scribble = "scribble.cli:main"

[project.urls]
Repository = "https://github.com/rarrarrarr/scribble"
Issues = "https://github.com/rarrarrarr/scribble/issues"

[project.optional-dependencies]
gpu = [
    "cuda-toolkit[cudart,nvrtc]==12.*",
    "cupy-cuda12x>=14",
    "pynvvideocodec>=2.2",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

# The package is src/scribble; without this, uv_build would look for src/scribble_video.
[tool.uv.build-backend]
module-name = "scribble"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: list skipped tests with their reasons at the end, so it shows when the GPU ones didn't run
addopts = "-ra"
markers = [
    "gpu: needs an NVIDIA GPU and the gpu extra (skipped otherwise)",
    "slow: renders whole (short) videos",
]
